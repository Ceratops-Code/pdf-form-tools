name: Validate
permissions:
  contents: read
jobs:
  validate-repository:
    name: validate-repository
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install Python validation dependencies
        run: 'python -m pip install -e ".[dev]"

          '
      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - name: Validate repository
        uses: Ceratops-Code/Ceratops-AI-Agents-Kit/skills/ceratops-repo-lifecycle/scripts@fd2616cac03ef727a0ea96dc778ad15295d05b90 # revision fd2616cac03e
        with:
          repo-root: ${{ github.workspace }}
          evidence-file: ${{ runner.temp }}/repository-validation.log
      - name: Upload validation evidence
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          if-no-files-found: ignore
          name: repository-validation-evidence
          path: ${{ runner.temp }}/repository-validation.log
'on':
  workflow_dispatch: null
  push: null
  pull_request: null
