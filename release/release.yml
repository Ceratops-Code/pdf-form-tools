version: 1
kind: ceratops-release
artifacts:
  - artifact_type: pypi_python_package
    registry: pypi.org
    package_or_image_name: pdf-form-tools
    version_source: pyproject.toml:[project].version
    release_policy: v-prefixed tag push with PyPI trusted publishing
    tag_style: v-prefixed semantic version
    changelog_source: CHANGELOG.md
    post_publish_consumer_check: install the released version from PyPI and import pdf_form_tools
operations:
  preflight:
    steps:
      - id: check-release-version
        run:
          - python
          - scripts/publish_current_version.py
          - --check-only
  publish:
    steps:
      - id: publish-and-verify-release
        run:
          - python
          - scripts/publish_current_version.py
