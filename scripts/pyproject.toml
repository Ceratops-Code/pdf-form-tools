[project]
name = "repository-tools"
version = "0.0.0"
requires-python = ">=3.11"
dependencies = ["build>=1.2", "mypy", "ruff", "twine>=5.1"]

[tool.uv]
package = false

[tool.uv.workspace]
members = []

[tool.mypy]
files = ["."]
exclude = ["(^|/)\\.venv/"]
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_configs = true
