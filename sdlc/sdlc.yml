version: 4
kind: ceratops-sdlc

repository:
  capabilities:
    python:
      executable: python
      version-from:
        file: pyproject.toml
        key: project.requires-python
    git:
      executable: git
    gh:
      executable: gh
  actions:
    validate:
      requires:
        capabilities: [python]
      steps:
        - run: [python, -m, ruff, check, .]
    test:
      requires:
        capabilities: [python]
      steps:
        - run: [python, -m, pytest, -W, "error::DeprecationWarning"]

deliverables:
  packages:
    pdf-form-tools:
      source: src/pdf_form_tools
      project: pyproject.toml
      prerequisites: []
      artifact:
        type: python-wheel
        distribution: pdf-form-tools
        output-directory: dist
        filename-pattern: pdf_form_tools-*.whl
      actions:
        build:
          requires:
            capabilities: [python]
          steps:
            - run: [python, -m, build, --outdir, dist]
        publish:
          requires:
            capabilities: [python, git, gh]
          steps:
            - run: [python, scripts/publish_current_version.py, --check-only]
            - run: [python, scripts/publish_current_version.py, --trigger-release]

  tools:
    pdf-form-tools:
      source: src/pdf_form_tools
      manifest: pyproject.toml
      prerequisites: [pdf-form-tools]
      actions:
        validate:
          requires:
            capabilities: []
          no-op: Repository validation covers the local package source and metadata.
        install:
          requires:
            capabilities: [python]
          steps:
            - run: [python, scripts/deploy_local_package.py]
