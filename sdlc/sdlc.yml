version: 4
kind: ceratops-sdlc
repository:
  capabilities:
    python:
      executable: python
      version-from:
        file: pyproject.toml
        key: project.requires-python
    uv:
      executable: uv
    git:
      executable: git
    gh:
      executable: gh
  actions:
    validate:
      requires:
        capabilities:
          - uv
      steps:
        - run:
            - uv
            - run
            - --locked
            - scripts/validate-repository.py
    test:
      requires:
        capabilities:
          - python
          - uv
      steps:
        - run:
            - uv
            - run
            - --no-project
            - --python
            - '3.11'
            - --with=pytest
            - --with-editable
            - .
            - python
            - -m
            - pytest
            - -W
            - error::DeprecationWarning
    bootstrap:
      requires:
        capabilities:
          - uv
      steps:
        - run:
            - uv
            - sync
            - --project
            - scripts
            - --locked
deliverables:
  packages:
    pdf-form-tools:
      source: src/pdf_form_tools
      project: pyproject.toml
      prerequisites: []
      artifact:
        type: python-wheel
        distribution: pdf-form-tools
        output-directory: dist
        filename-pattern: pdf_form_tools-*.whl
      actions:
        build:
          requires:
            capabilities:
              - python
              - uv
          steps:
            - run:
                - uv
                - build
                - --out-dir
                - dist
        publish:
          requires:
            capabilities:
              - python
              - git
              - gh
          steps:
            - run:
                - python
                - scripts/publish_current_version.py
                - --check-only
            - run:
                - python
                - scripts/publish_current_version.py
                - --trigger-release
