version: 5
kind: ceratops-sdlc
repository:
  tools:
    python:
      executable: python
      version-from:
        file: scripts/pyproject.toml
        key: project.requires-python
    uv:
      executable: uv
    git:
      executable: git
    gh:
      executable: gh
  actions:
    pre-build-checks:
      check-groups:
        pdf-form-tools-validator:
          requires:
            tools:
              - uv
              - python
          validation-tools:
            - pdf-form-tools-validator
          check-results:
            result-owner: operation
            product-inputs:
              - src/**
              - pyproject.toml
              - README.md
              - LICENSE
              - MANIFEST.in
            check-inputs:
              - sdlc/sdlc.yml
              - scripts/pyproject.toml
              - scripts/validate_repository.py
              - pyproject.toml
            dependencies:
              - scripts/uv.lock
            environment:
              - UV_OFFLINE
              - UV_PYTHON
              - UV_PYTHON_PREFERENCE
              - UV_INDEX
              - UV_DEFAULT_INDEX
            tools:
              - uv
              - python
          steps:
            - run: [uv, run, --project, scripts, --locked, python, scripts/validate_repository.py, --package-only]
        actionlint:
          requires:
            tools:
              - uv
              - python
          validation-tools:
            - actionlint
          check-results:
            result-owner: operation
            product-inputs:
              - .github/workflows/*.yml
              - .github/workflows/*.yaml
              - .github/actions/**
            check-inputs:
              - sdlc/sdlc.yml
              - scripts/pyproject.toml
              - scripts/run-actionlint.py
              - .github/actionlint.yaml
              - .github/actionlint.yml
            dependencies:
              - scripts/uv.lock
            environment:
              - UV_OFFLINE
              - UV_PYTHON
              - UV_PYTHON_PREFERENCE
              - GITHUB_EVENT_NAME
              - GITHUB_EVENT_PATH
              - GITHUB_ACTIONS
            tools:
              - uv
              - python
          steps:
            - run: [uv, run, --project, scripts, --locked, python, scripts/run-actionlint.py]
        ruff:
          requires:
            tools:
              - uv
              - python
          validation-tools:
            - ruff
          check-results:
            result-owner: operation
            product-inputs:
              - '**/*.py'
              - '**/*.pyi'
              - '**/*.ipynb'
            check-inputs:
              - sdlc/sdlc.yml
              - scripts/pyproject.toml
              - pyproject.toml
              - .gitignore
              - '**/.gitignore'
            dependencies:
              - scripts/uv.lock
            environment:
              - UV_OFFLINE
              - UV_PYTHON
              - UV_PYTHON_PREFERENCE
            tools:
              - uv
              - python
          steps:
            - run: [uv, run, --project, scripts, --locked, python, -m, ruff, check, ., --config, pyproject.toml]
        mypy:
          requires:
            tools:
              - uv
              - python
          validation-tools:
            - mypy
          check-results:
            result-owner: operation
            product-inputs:
              - '**/*.py'
              - '**/*.pyi'
              - '**/*.ipynb'
            check-inputs:
              - sdlc/sdlc.yml
              - scripts/pyproject.toml
              - .gitignore
              - '**/.gitignore'
            dependencies:
              - scripts/uv.lock
            environment:
              - UV_OFFLINE
              - UV_PYTHON
              - UV_PYTHON_PREFERENCE
              - MYPYPATH
            tools:
              - uv
              - python
          steps:
            - run:
                - uv
                - run
                - --project
                - scripts
                - --locked
                - python
                - -m
                - mypy
                - --config-file
                - scripts/pyproject.toml
                - --explicit-package-bases
                - scripts
                - src
        tests:
          requires:
            tools:
              - python
              - uv
          steps:
            - run:
                - uv
                - run
                - --no-project
                - --python
                - '3.11'
                - --with=pytest
                - --with-editable
                - .
                - python
                - -m
                - pytest
                - -W
                - error::DeprecationWarning
    bootstrap:
      requires:
        tools:
          - uv
      steps:
        - run: [uv, sync, --project, scripts, --locked]
deliverables:
  packages:
    pdf-form-tools:
      root-dir: src/pdf_form_tools
      project: pyproject.toml
      build-after: []
      artifact:
        type: python-wheel
        distribution: pdf-form-tools
        output-directory: dist
        filename-pattern: pdf_form_tools-*.whl
      actions:
        build:
          requires:
            tools:
              - python
              - uv
          steps:
            - run: [uv, build, --out-dir, dist]
        publish:
          requires:
            tools:
              - python
              - git
              - gh
          steps:
            - run: [python, scripts/publish_current_version.py, --check-only]
            - run: [python, scripts/publish_current_version.py, --trigger-release]
